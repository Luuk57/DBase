<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mijn Centrale Database Dashboard</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; background: #f4f6f9; }
    header { background: #2c3e50; color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
    .container { display: flex; height: calc(100vh - 60px); }
    
    /* Zijbalk Navigatie */
    nav { width: 200px; background: #34495e; padding: 20px 0; }
    nav button { width: 100%; padding: 15px 20px; border: none; background: none; color: #ecf0f1; text-align: left; font-size: 16px; cursor: pointer; transition: 0.3s; }
    nav button:hover, nav button.active { background: #1abc9c; color: white; font-weight: bold; }

    /* Hoofdinhoud */
    main { flex: 1; padding: 20px; overflow-y: auto; }
    .content-section { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    @media (max-width: 900px) { .content-section { grid-template-columns: 1fr; } }
    
    .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    iframe { width: 100%; height: 400px; border: 1px solid #ddd; border-radius: 6px; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { border: 1px solid #e0e0e0; padding: 10px; text-align: left; }
    th { background: #f8f9fa; }
  </style>
</head>
<body>

  <header>
    <h2>Data Beheer Dashboard</h2>
  </header>

  <div class="container">
    <!-- Zijbalk om te wisselen -->
    <nav>
      <button onclick="laadDashboard('dialyse')" id="btn-dialyse" class="active">Dialyse</button>
      <button onclick="laadDashboard('vervoer')" id="btn-vervoer">Vervoer</button>
      <button onclick="laadDashboard('eten')" id="btn-eten">Eten</button>
      <button onclick="laadDashboard('drinken')" id="btn-drinken">Drinken</button>
    </nav>

    <!-- Hoofdgedeelte -->
    <main>
      <h2 id="titel">Dialyse Overzicht & Invoer</h2>
      
      <div class="content-section">
        <!-- Links: Bestaand Formulier via iframe -->
        <div class="card">
          <h3>Invoeren</h3>
          <iframe id="formFrame" src="https://luuk57.github.io/Dialyseformulier/"></iframe>
        </div>

        <!-- Rechts: Live Overzicht uit Google Sheet -->
        <div class="card">
          <h3>Overzicht (Database)</h3>
          <div id="status">Laden...</div>
          <table id="dataTable" style="display:none;">
            <thead id="tableHead"></thead>
            <tbody id="tableBody"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <script>
    // Jouw centrale Google Apps Script Web App URL
    const API_URL = "VUL_HIER_JOUW_APPS_SCRIPT_WEB_APP_URL_IN";

    // Paden naar jouw bestaande HTML-formulieren op GitHub
    const FORM_URLS = {
      dialyse: "dialyse_form.html",  // Vul hier de bestandsnaam of URL van je bestaande formulier in
      vervoer: "vervoer_form.html",
      eten:    "eten_form.html",
      drinken: "drinken_form.html"
    };

    let huidigeTarget = 'dialyse';

    async function laadDashboard(target) {
      huidigeTarget = target;
      
      // Update Titel & Navigatie
      document.getElementById('titel').innerText = `${target.toUpperCase()} Overzicht & Invoer`;
      document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
      document.getElementById(`btn-${target}`).classList.add('active');

      // Update Formulier iFrame
      document.getElementById('formFrame').src = FORM_URLS[target];

      // Haal Overzicht Data op
      document.getElementById('status').innerText = `Gegevens ophalen voor ${target}...`;
      document.getElementById('dataTable').style.display = 'none';

      try {
        const response = await fetch(`${API_URL}?target=${target}`);
        const result = await response.json();

        if (result.status === "success") {
          toonTabel(result.data);
          document.getElementById('status').innerText = "";
        } else {
          document.getElementById('status').innerText = "Fout bij ophalen data: " + result.message;
        }
      } catch (err) {
        document.getElementById('status').innerText = "Verbindingsfout.";
      }
    }

    function toonTabel(rows) {
      const head = document.getElementById('tableHead');
      const body = document.getElementById('tableBody');
      head.innerHTML = "";
      body.innerHTML = "";

      if (!rows || rows.length === 0) {
        document.getElementById('status').innerText = "Geen data gevonden.";
        return;
      }

      // Headers (Rij 0)
      let headHtml = "<tr>";
      rows[0].forEach(header => headHtml += `<th>${header}</th>`);
      headHtml += "</tr>";
      head.innerHTML = headHtml;

      // Data Rijen
      for (let i = 1; i < rows.length; i++) {
        let bodyHtml = "<tr>";
        rows[i].forEach(cell => bodyHtml += `<td>${cell}</td>`);
        bodyHtml += "</tr>";
        body.innerHTML += bodyHtml;
      }

      document.getElementById('dataTable').style.display = 'table';
    }

    // Automatisch starten met Dialyse bij het openen van de pagina
    laadDashboard('dialyse');
  </script>
</body>
</html>
